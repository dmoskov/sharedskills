name: Sync Task Branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'conftest.py'
  workflow_dispatch: {}

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync task branches
        shell: bash {0}
        run: |
          echo "=== Syncing task/* branches with main ==="
          git fetch --all --prune

          SYNCED=0
          SKIPPED=0
          FAILED=0

          for branch in $(git branch -r | grep 'origin/task/' | sed 's|origin/||' | xargs); do
            echo ""
            echo "--- $branch ---"

            BEHIND=$(git rev-list --count "origin/$branch..origin/main" 2>/dev/null || echo "0")
            if [ "$BEHIND" = "0" ]; then
              echo "  Already up to date"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            echo "  Behind main by $BEHIND commits"

            if ! git checkout -B "$branch" "origin/$branch" 2>/dev/null; then
              echo "  SKIP: Failed to checkout"
              FAILED=$((FAILED + 1))
              continue
            fi

            if ! git merge origin/main --no-edit 2>&1; then
              echo "  SKIP: Merge conflict (executor will handle)"
              git merge --abort 2>/dev/null || true
              FAILED=$((FAILED + 1))
              continue
            fi

            if ! git push origin "$branch" 2>&1; then
              echo "  SKIP: Push failed"
              FAILED=$((FAILED + 1))
              continue
            fi

            echo "  Synced"
            SYNCED=$((SYNCED + 1))
          done

          echo ""
          echo "=== Summary ==="
          echo "  Synced: $SYNCED"
          echo "  Up to date: $SKIPPED"
          echo "  Failed/conflict: $FAILED"
